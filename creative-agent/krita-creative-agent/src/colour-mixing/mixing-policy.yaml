# Which mixing model each kind of paint pass uses. A rule applies only when the pass's preset has a measured
# catalog card for that model (brush-catalog.json "mixing"); otherwise the pass mixes as rgb. The painter's explicit
# `mixing` on a pass wins. Painting practice: block in without mixing, mix in the middle layers, finish clean.
version: 1
kinds:
  underpainting: rgb     # reference transfer / block-in: big separate shapes
  block_in: rgb
  finish: spectral       # finish and refine: transitions, soft edges, skies, water, skin
  refine: spectral
  blend: spectral        # blender / wet / smudge passes
  glaze: spectral        # thin layers over existing paint
  atmosphere: spectral   # fog, haze, gradients
  element: spectral      # painting an element over the underpainting
  details: rgb           # small crisp marks
  accents: rgb           # highlights and edges must not pick up the colour beneath
default: rgb
